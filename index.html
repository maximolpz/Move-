<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pausa activa</title>
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#101820; --panel:#1B2733; --txt:#F4F7F5; --mute:#9FB1BF;
    --acc:#C6F432; --acc-txt:#101820; --stop:#FF5A4F; --line:#2C3C4B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif}
  body{display:flex;justify-content:center;padding:20px 16px 40px}
  main{width:100%;max-width:480px}
  h1{font-size:1.1rem;font-weight:700;margin:0 0 18px;color:var(--mute)}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
  .opts button{padding:14px 0;border:2px solid var(--line);background:transparent;color:var(--txt);
    font-size:1rem;font-weight:700;border-radius:12px;cursor:pointer}
  .opts button[aria-pressed="true"]{background:var(--acc);color:var(--acc-txt);border-color:var(--acc)}
  .opts button:disabled{opacity:.45;cursor:not-allowed}
  .clock{background:var(--panel);border-radius:20px;padding:28px 16px;text-align:center;margin-bottom:14px}
  .time{font-size:clamp(3.4rem,18vw,5.4rem);font-weight:900;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1}
  .bar{height:8px;background:var(--line);border-radius:4px;margin:20px 6px 0;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--acc)}
  .status{margin-top:12px;color:var(--mute);font-size:.95rem;min-height:1.3em}
  .card{border:2px dashed var(--line);border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px}
  .card.on{border:2px solid var(--acc);background:#1d2b1a}
  .card .reps{font-size:3rem;font-weight:900;color:var(--acc);line-height:1}
  .card .name{font-size:1.7rem;font-weight:800;margin:6px 0}
  .card .how{color:var(--mute);font-size:1rem;line-height:1.4}
  .card.ring{animation:pulse .5s steps(2) infinite}
  @keyframes pulse{50%{background:#2d4222}}
  @media (prefers-reduced-motion:reduce){.card.ring{animation:none}}
  .ctl{display:grid;gap:10px}
  .ctl button{padding:18px;border:0;border-radius:14px;font-size:1.15rem;font-weight:800;cursor:pointer}
  #go{background:var(--acc);color:var(--acc-txt)}
  #stop{background:var(--stop);color:#fff}
  .opts{grid-template-columns:repeat(5,1fr)}
  .opts button{font-size:.9rem}
  .snd{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .snd button,#pv{padding:12px 0;border:2px solid var(--line);background:transparent;color:var(--txt);font-size:.95rem;font-weight:700;border-radius:12px;cursor:pointer}
  .snd button[aria-pressed="true"]{background:var(--acc);color:var(--acc-txt);border-color:var(--acc)}
  .snd button:disabled,#pv:disabled,#vol:disabled,#custom:disabled{opacity:.45;cursor:not-allowed}
  .vol{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--mute);font-size:.95rem}
  .vol input{flex:1;accent-color:var(--acc)}
  #pv{padding:12px 16px}
  #custom{width:100%;padding:14px;margin-bottom:12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--txt);font-size:1.1rem;font-weight:700}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  [hidden]{display:none!important}
  .foot{color:var(--mute);font-size:.8rem;line-height:1.4;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="opts" role="group" aria-label="Cada cuánto tiempo">
    <button data-min="15" aria-pressed="true">15 min</button>
    <button data-min="30" aria-pressed="false">30 min</button>
    <button data-min="60" aria-pressed="false">1 h</button>
    <button data-min="90" aria-pressed="false">1 h 30</button>
    <button data-min="custom" aria-pressed="false">Otro</button>
  </div>
  <div id="customRow" hidden>
    <input id="custom" type="number" inputmode="numeric" min="1" max="120" placeholder="Minutos (1 a 120)" aria-label="Minutos">
  </div>

  <div class="snd" role="group" aria-label="Sonido">
    <button data-snd="cs" aria-pressed="true">CS Radio</button>
    <button data-snd="voz" aria-pressed="false">Voz</button>
  </div>
  <div class="vol">
    <span>Volumen</span>
    <input id="vol" type="range" min="10" max="100" value="80" aria-label="Volumen">
    <button id="pv">Probar</button>
  </div>

  <section class="clock">
    <div class="time" id="time" aria-live="off">15:00</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="status" id="status"></div>
  </section>

  <section class="card" id="card" aria-live="polite">
    <div class="how" id="idle">Acá va a aparecer tu ejercicio cuando suene la alarma.</div>
    <div id="ex" hidden>
      <div class="reps" id="reps"></div>
      <div class="name" id="name"></div>
      <div class="how" id="how"></div>
    </div>
  </section>

  <div class="ctl">
    <button id="go">Empezar</button>
    <button id="stop" hidden>Detener todo</button>
  </div>

</main>

<script>
const EXERCISES = [
  {n:"Sentadillas", r:"10 repeticiones", h:"Pies al ancho de hombros, bajá como si te sentaras y subí."},
  {n:"Abdominales", r:"10 repeticiones", h:"Acostado, rodillas dobladas, subí el pecho hacia las rodillas."},
  {n:"Flexiones de brazos", r:"8 repeticiones", h:"Podés apoyar las rodillas. Bajá el pecho al piso y empujá."},
  {n:"Fondos de tríceps en silla", r:"10 repeticiones", h:"Manos en el borde de la silla, bajá el cuerpo doblando los codos."},
  {n:"Curl de bíceps con botella", r:"12 por brazo", h:"Una botella con agua en cada mano, subila doblando el codo."},
  {n:"Zancadas", r:"8 por pierna", h:"Un paso largo adelante, bajá la rodilla de atrás y volvé."},
  {n:"Plancha", r:"30 segundos", h:"Apoyado en antebrazos y puntas de pie, cuerpo recto como una tabla."},
  {n:"Saltos de tijera", r:"20 saltos", h:"Saltá abriendo piernas y brazos, volvé a juntarlos."},
  {n:"Rodillas al pecho", r:"20 en total", h:"De pie, subí una rodilla y luego la otra, a ritmo rápido."},
  {n:"Elevación de talones", r:"15 repeticiones", h:"De pie, subí en puntas de pie y bajá despacio."},
  {n:"Giros de cintura", r:"10 por lado", h:"Manos en la cintura, dibujá círculos amplios con la cadera."},
  {n:"Círculos de brazos", r:"10 hacia adelante y 10 hacia atrás", h:"Brazos estirados, círculos grandes."},
  {n:"Puente de glúteos", r:"12 repeticiones", h:"Acostado, rodillas dobladas, subí la cadera y apretá."},
  {n:"Escaladores", r:"20 en total", h:"En posición de flexión, llevá una rodilla al pecho y alterná."},
  {n:"Sentadilla de pared", r:"30 segundos", h:"Espalda contra la pared, muslos paralelos al piso. Aguantá."},
  {n:"Elevación de hombros", r:"15 repeticiones", h:"Subí los hombros hacia las orejas, sostené 1 segundo y soltá."},
  {n:"Patada de burro", r:"10 por pierna", h:"En cuatro apoyos, subí una pierna doblada hacia el techo."},
  {n:"Estiramiento de espalda", r:"30 segundos", h:"Entrelazá las manos, estirá los brazos al frente y redondeá la espalda."}
];

const $ = id => document.getElementById(id);
let minutes = 15, intervalS = 900;
let running = false, timer = null, lastEx = -1, shown = false, prevPos = 0;
let audio = null, url = null, wake = null, ctx = null, t0 = 0;
let sound = "cs", vol = 0.8;
let silS = 900, ringS = 3.3, pvSrc = null;

const fmt = ms => {
  const s = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,"0");
  return h ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
};

/* ---------- Selector de intervalo ---------- */
const optBtns = document.querySelectorAll(".opts button");
function setCustom(){
  const v = Math.floor(+$("custom").value);
  minutes = (v >= 1 && v <= 120) ? v : 0;
  $("time").textContent = minutes ? fmt(minutes*60000) : "--:--";
}
optBtns.forEach(b => b.onclick = () => {
  optBtns.forEach(x => x.setAttribute("aria-pressed", x===b));
  const custom = b.dataset.min === "custom";
  $("customRow").hidden = !custom;
  if(custom){ setCustom(); $("custom").focus(); }
  else { minutes = +b.dataset.min; $("time").textContent = fmt(minutes*60000); }
});
$("custom").oninput = setCustom;
function lockOptions(v){
  document.querySelectorAll(".opts button,.snd button,#custom,#vol,#pv").forEach(b => b.disabled = v);
}

const AL = {cs: toBytes(B64.cs), voz: toBytes(B64.voz)}, SIL = toBytes(B64.sil);
const frameLen = (u, i) => 104 + ((u[i+2] >> 1) & 1);
function countFrames(u){ let i = 0, n = 0; while(i + 3 < u.length){ i += frameLen(u, i); n++; } return n; }
function framesBytes(u, n){ let i = 0; for(let k=0;k<n;k++) i += frameLen(u, i); return i; }

/* Audio de un ciclo completo: silencio + alarma, en bucle. Al ser un <audio> real,
   el sistema lo sigue reproduciendo con la pantalla bloqueada. */
function buildAudio(intervalS, type){
  const total = Math.round(intervalS / FRAME_S);
  const full = Math.floor(total / UNIT_FRAMES), rem = total % UNIT_FRAMES;
  const parts = [];
  for(let k=0;k<full;k++) parts.push(SIL);
  if(rem) parts.push(SIL.subarray(0, framesBytes(SIL, rem)));
  parts.push(AL[type]);
  return {blob: new Blob(parts, {type:"audio/mpeg"}), silS: total * FRAME_S, ringS: countFrames(AL[type]) * FRAME_S};
}

function ensureCtx(){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
  }catch(e){}
  return ctx;
}
const decoded = {};
function stopPreview(){ try{ if(pvSrc){ pvSrc.stop(); pvSrc = null; } }catch(e){} }
async function playAlarm(){          // WebAudio: para probar y como respaldo
  if(!ensureCtx()) return;
  const type = sound;
  try{
    if(!decoded[type]) decoded[type] = await ctx.decodeAudioData(AL[type].slice().buffer);
    stopPreview();                     // nunca dos sonidos a la vez
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = decoded[type]; g.gain.value = vol;
    src.connect(g); g.connect(ctx.destination); src.start();
    pvSrc = src; src.onended = () => { if(pvSrc === src) pvSrc = null; };
  }catch(e){}
}
function preview(){ if(!running) playAlarm(); }

document.querySelectorAll(".snd button").forEach(b => b.onclick = () => {
  sound = b.dataset.snd;
  document.querySelectorAll(".snd button").forEach(x => x.setAttribute("aria-pressed", x===b));
  preview();
});
$("vol").oninput = () => { vol = $("vol").value / 100; };   // mover el volumen no reproduce nada
$("pv").onclick = preview;

/* ---------- Pantalla encendida (extra, no imprescindible) ---------- */
async function keepAwake(){ try{ if(navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseAwake(){ try{ if(wake){ wake.release(); wake = null; } }catch(e){} }
document.addEventListener("visibilitychange", () => {
  if(!running) return;
  if(document.visibilityState === "visible"){ keepAwake(); if(audio && audio.paused) audio.play().catch(()=>{}); }
});

/* ---------- Ejercicio ---------- */
function showExercise(ring){
  let i; do{ i = Math.floor(Math.random()*EXERCISES.length); }while(i===lastEx && EXERCISES.length>1);
  lastEx = i; const e = EXERCISES[i];
  $("reps").textContent = e.r; $("name").textContent = e.n; $("how").textContent = e.h;
  $("idle").hidden = true; $("ex").hidden = false;
  $("card").classList.add("on");
  return e;
}

/* ---------- Ciclo ----------
   La posición sale del audio si está andando; si no, de un reloj normal (así la cuenta siempre avanza). */
function healthy(){ return !!audio && !audio.error && !audio.paused && audio.currentTime > 0; }
function position(){
  return healthy() ? audio.currentTime : ((Date.now() - t0) / 1000) % (silS + ringS);
}
async function notify(e){            // aviso con la pantalla bloqueada
  try{
    if(!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
    const o = {body: e.r + " · " + e.h, tag:"pausa", renotify:true, vibrate:[300,150,300], icon:"icon-192.png"};
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg) reg.showNotification(e.n, o); else new Notification(e.n, o);
  }catch(_){}
}
function tick(){
  if(!running) return;
  const pos = position();
  if(pos < prevPos - 1) shown = false;                // empezó un ciclo nuevo
  prevPos = pos;
  const ok = healthy();
  if(pos < silS){
    const left = (silS - pos) * 1000;
    $("time").textContent = fmt(left);
    $("fill").style.width = (pos/silS*100) + "%";
    $("card").classList.remove("ring");
    $("status").textContent = (ok || Date.now() - t0 < 2500)
      ? "Contando… podés bloquear el celular y dejarlo en la mesa."
      : "Aviso: el audio de fondo no arrancó. La alarma sonará solo con la pantalla encendida.";
    document.title = fmt(left) + " · Pausa activa";
  } else {
    if(!shown){
      shown = true; const ex = showExercise(true); notify(ex);
      if(!ok) playAlarm();
      if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
    }
    $("card").classList.add("ring");
    $("time").textContent = "00:00"; $("fill").style.width = "100%";
    $("status").textContent = "¡Es hora! Hacé el ejercicio.";
    document.title = "¡Movete! · Pausa activa";
  }
}
function begin(sec){
  if(!(minutes >= 1)){ $("custom").focus(); return; }
  intervalS = minutes*60;
  try{ if("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }catch(e){}
  ensureCtx();
  try{
    stopPreview();
    const built = buildAudio(intervalS, sound);
    silS = built.silS; ringS = built.ringS;
    url = URL.createObjectURL(built.blob);
    audio = new Audio(url); audio.loop = true; audio.volume = vol;
    const pr = audio.play(); if(pr && pr.catch) pr.catch(() => {});
  }catch(e){ audio = null; }
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({title:"Pausa activa", artist:"Alarma cada " + (minutes + " min")});
      navigator.mediaSession.setActionHandler("pause", stopAll);
      navigator.mediaSession.setActionHandler("stop", stopAll);
    }catch(e){}
  }
  running = true; shown = false; prevPos = 0; t0 = Date.now();
  keepAwake(); lockOptions(true);
  $("go").hidden = true; $("stop").hidden = false;
  clearInterval(timer); timer = setInterval(tick, 250); tick();
}
function stopAll(){
  running = false; clearInterval(timer); releaseAwake();
  if(audio){ audio.pause(); audio.removeAttribute("src"); audio.load(); audio = null; }
  if(url){ URL.revokeObjectURL(url); url = null; }
  if("mediaSession" in navigator){ try{ navigator.mediaSession.setActionHandler("pause", null); navigator.mediaSession.setActionHandler("stop", null); navigator.mediaSession.metadata = null; }catch(e){} }
  if(navigator.vibrate) navigator.vibrate(0);
  lockOptions(false);
  $("time").textContent = fmt(minutes*60000); $("fill").style.width = "0";
  $("status").textContent = "";
  $("card").classList.remove("ring","on");
  $("ex").hidden = true; $("idle").hidden = false;
  $("go").hidden = false; $("stop").hidden = true;
  document.title = "Pausa activa";
}
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(() => {});
$("go").onclick = () => begin();
$("stop").onclick = stopAll;
</script>
